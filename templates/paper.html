<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ · John J. Horton</title>
  <meta name="description" content="$description$">
  <link rel="canonical" href="$canonical$">
  <meta property="og:type" content="article">
  <meta property="og:title" content="$title$">
  <meta property="og:description" content="$description$">
  <meta property="og:url" content="$canonical$">
  <meta property="og:image" content="https://john-joseph-horton.com/images/social-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../../images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../site.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#paper-content">Skip to paper</a>
  <div class="site-shell">
    <main class="site-main">
      <div class="top-actions">
        <span id="copy-status" class="status" aria-live="polite"></span>
        <button id="copy-markdown" class="copy-button" type="button">Copy as Markdown</button>
      </div>
      <article id="paper-content" class="paper-content">$body$</article>
    </main>
    <footer class="site-footer">Last updated: $lastupdated$</footer>
  </div>
  <script src="paper-markdown.js"></script>
  <script>
    function legacyCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.setAttribute('readonly', '');
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      const copied = document.execCommand('copy');
      textArea.remove();
      return copied;
    }
    document.getElementById('copy-markdown').addEventListener('click', async function () {
      const status = document.getElementById('copy-status');
      try {
        const markdown = window.PAGE_MARKDOWN || '';
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(markdown);
        } else if (!legacyCopy(markdown)) {
          throw new Error('Copy command failed');
        }
        status.textContent = 'Copied';
        setTimeout(function () { status.textContent = ''; }, 2000);
      } catch (error) { status.textContent = 'Copy failed'; }
    });
    document.getElementById('copy-bibtex').addEventListener('click', async function () {
      const status = document.getElementById('bibtex-copy-status');
      const citation = document.querySelector('pre code').textContent;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(citation);
        } else if (!legacyCopy(citation)) {
          throw new Error('Copy command failed');
        }
        status.textContent = 'Copied';
        setTimeout(function () { status.textContent = ''; }, 2000);
      } catch (error) { status.textContent = 'Copy failed'; }
    });
  </script>
</body>
</html>
