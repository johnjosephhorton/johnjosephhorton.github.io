<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ · John J. Horton</title>
  <meta name="description" content="$description$">
  <link rel="canonical" href="$canonical$">
  <meta property="og:type" content="article">
  <meta property="og:title" content="$title$">
  <meta property="og:description" content="$description$">
  <meta property="og:url" content="$canonical$">
  <meta name="twitter:card" content="summary">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @layer utilities {
      .paper-content h1 { @apply mt-8 mb-4 text-4xl font-bold tracking-tight text-gray-900; }
      .paper-content h2 { @apply mt-10 mb-3 border-b border-gray-200 pb-2 text-xl font-semibold text-gray-900; }
      .paper-content p { @apply mb-4 leading-relaxed text-gray-700; }
      .paper-content a { @apply text-blue-600 hover:text-blue-800 hover:underline; }
      .paper-content pre { @apply overflow-x-auto rounded-xl bg-gray-900 p-5 text-sm text-gray-100; }
      .copy-button { @apply rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50; }
      .video-embed { @apply my-5 overflow-hidden rounded-xl bg-black shadow-sm; aspect-ratio: 16 / 9; }
      .video-embed iframe { @apply h-full w-full border-0; }
    }
  </style>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
</head>
<body class="min-h-screen bg-gray-50 font-sans">
  <div class="mx-auto max-w-4xl px-6 py-12 sm:py-16">
    <main class="rounded-2xl border border-gray-100 bg-white px-8 py-10 shadow-sm sm:px-14 sm:py-14">
      <div class="mb-4 flex justify-end gap-3">
        <span id="copy-status" class="self-center text-sm text-gray-500" aria-live="polite"></span>
        <button id="copy-markdown" class="copy-button" type="button">Copy as Markdown</button>
      </div>
      <article class="paper-content">$body$</article>
    </main>
    <footer class="mt-8 text-center text-sm text-gray-500">Last updated: $lastupdated$</footer>
  </div>
  <script src="paper-markdown.js"></script>
  <script>
    function legacyCopy(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.setAttribute('readonly', '');
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      const copied = document.execCommand('copy');
      textArea.remove();
      return copied;
    }
    document.getElementById('copy-markdown').addEventListener('click', async function () {
      const status = document.getElementById('copy-status');
      try {
        const markdown = window.PAGE_MARKDOWN || '';
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(markdown);
        } else if (!legacyCopy(markdown)) {
          throw new Error('Copy command failed');
        }
        status.textContent = 'Copied';
        setTimeout(function () { status.textContent = ''; }, 2000);
      } catch (error) { status.textContent = 'Copy failed'; }
    });
    document.getElementById('copy-bibtex').addEventListener('click', async function () {
      const status = document.getElementById('bibtex-copy-status');
      const citation = document.querySelector('pre code').textContent;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(citation);
        } else if (!legacyCopy(citation)) {
          throw new Error('Copy command failed');
        }
        status.textContent = 'Copied';
        setTimeout(function () { status.textContent = ''; }, 2000);
      } catch (error) { status.textContent = 'Copy failed'; }
    });
  </script>
</body>
</html>
