<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$pagetitle$</title>
  <meta name="description" content="John J. Horton is the Chrysler Professor of Management at MIT Sloan. Research on AI, market design, labor economics, and online markets.">
  <link rel="canonical" href="https://john-joseph-horton.com/">
  <meta property="og:type" content="website"><meta property="og:title" content="John J. Horton"><meta property="og:description" content="Research, teaching, talks, and writing by MIT economist John J. Horton."><meta property="og:url" content="https://john-joseph-horton.com/"><meta property="og:image" content="https://john-joseph-horton.com/images/social-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="filters.css">
  <link rel="stylesheet" href="enhancements.css">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"John J. Horton","url":"https://john-joseph-horton.com/","jobTitle":"Chrysler Professor of Management","affiliation":[{"@type":"Organization","name":"MIT Sloan School of Management"},{"@type":"Organization","name":"National Bureau of Economic Research"}],"founder":{"@type":"Organization","name":"Expected Parrot","url":"https://www.expectedparrot.com"},"sameAs":["https://orcid.org/0000-0001-5426-0156","https://scholar.google.com/citations?user=L_O2kH0AAAAJ&hl=en","https://www.nber.org/people/john_horton","https://www.expectedparrot.com"]}</script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <main id="main-content" class="site-main">
      <div class="top-actions">
        <span id="copy-markdown-status" class="status" aria-live="polite"></span>
        <button id="copy-markdown" class="button" type="button">Copy page as Markdown</button>
      </div>
      <article class="content">
$body$
      </article>
    </main>
    <footer class="site-footer">
      <p>&copy; $pagetitle$</p>
      <p>Last updated: <time id="last-updated" datetime="$lastupdated$">$lastupdated$</time></p>
    </footer>
  </div>
  <script src="page-markdown.js"></script>
  <script>
    // Turn the main CV sections into an accessible tab interface.
    document.addEventListener('DOMContentLoaded', function() {
      const copyButton = document.getElementById('copy-markdown');
      const copyStatus = document.getElementById('copy-markdown-status');

      function legacyCopy(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand('copy');
        textArea.remove();
        return copied;
      }

      copyButton.addEventListener('click', async function() {
        const markdown = window.PAGE_MARKDOWN;
        if (!markdown) {
          copyStatus.textContent = 'Markdown unavailable';
          return;
        }
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(markdown);
          } else if (!legacyCopy(markdown)) {
            throw new Error('Copy command failed');
          }
          copyStatus.textContent = 'Copied';
          copyButton.textContent = 'Copied!';
          window.setTimeout(function() {
            copyStatus.textContent = '';
            copyButton.textContent = 'Copy page as Markdown';
          }, 2000);
        } catch (error) {
          copyStatus.textContent = 'Copy failed';
        }
      });

      function installFilter(inputId, selector, groupSelector, countId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const items = Array.from(document.querySelectorAll(selector));
        const count = countId ? document.getElementById(countId) : null;
        let activeTopic = 'all';
        let activeStatus = 'all';
        let activeType = 'all';
        let activeView = inputId === 'research-search' ? 'selected' : 'all';
        function filter() {
          const query = input.value.trim().toLocaleLowerCase();
          let visible = 0;
          items.forEach(function(item) {
            const textMatch = !query || item.textContent.toLocaleLowerCase().includes(query) || (item.dataset.search || '').toLocaleLowerCase().includes(query);
            const topicMatch = activeTopic === 'all' || item.dataset.topic === activeTopic;
            const statusMatch = activeStatus === 'all' || item.dataset.status === activeStatus;
            const typeMatch = activeType === 'all' || item.dataset.type === activeType;
            const viewMatch = activeView === 'all' || (activeView === 'selected' ? item.dataset.selected === 'true' : item.dataset.recent === 'true');
            const match = textMatch && topicMatch && statusMatch && typeMatch && viewMatch;
            item.hidden = !match;
            if (match) visible += 1;
          });
          if (groupSelector) document.querySelectorAll(groupSelector).forEach(function(group) {
            group.hidden = !Array.from(group.querySelectorAll(selector)).some(function(item) { return !item.hidden; });
            if (query && !group.hidden) group.open = true;
          });
          if (count) count.textContent = visible + (visible === 1 ? ' paper' : ' papers');
        }
        input.addEventListener('input', filter);
        if (inputId === 'research-search') document.querySelectorAll('.view-chip').forEach(function(chip) {
          chip.addEventListener('click', function() {
            activeView = chip.dataset.view;
            document.querySelectorAll('.view-chip').forEach(function(other) { other.classList.toggle('active', other === chip); });
            filter();
          });
        });
        if (inputId === 'research-search') document.querySelectorAll('.filter-chip').forEach(function(chip) {
          chip.addEventListener('click', function() {
            activeTopic = chip.dataset.topic;
            document.querySelectorAll('.filter-chip').forEach(function(other) { other.classList.toggle('active', other === chip); });
            filter();
          });
        });
        if (inputId === 'research-search') document.querySelectorAll('.status-chip').forEach(function(chip) {
          chip.addEventListener('click', function() {
            activeStatus = chip.dataset.status;
            document.querySelectorAll('.status-chip').forEach(function(other) { other.classList.toggle('active', other === chip); });
            filter();
          });
        });
        if (inputId === 'research-search') document.querySelectorAll('.type-chip').forEach(function(chip) {
          chip.addEventListener('click', function() {
            activeType = chip.dataset.type;
            document.querySelectorAll('.type-chip').forEach(function(other) { other.classList.toggle('active', other === chip); });
            filter();
          });
        });
        if (inputId === 'research-search') {
          const sort = document.getElementById('research-sort');
          const results = document.getElementById('research-results');
          sort.addEventListener('change', function() {
            const direction = sort.value === 'oldest' ? 1 : -1;
            items.sort(function(a, b) {
              if (sort.value === 'updated') return a.dataset.updated === b.dataset.updated ? Number(a.dataset.order) - Number(b.dataset.order) : b.dataset.updated.localeCompare(a.dataset.updated);
              const comparison = a.dataset.year.localeCompare(b.dataset.year);
              return comparison === 0 ? Number(a.dataset.order) - Number(b.dataset.order) : direction * comparison;
            }).forEach(function(item) { results.appendChild(item); });
          });
        }
        filter();
      }
      installFilter('research-search', '.paper-entry', null, 'research-count');
      installFilter('talk-search', '.talk-year p', '.talk-year', null);

      const sectionIds = [
        'employment',
        'research',
        'awards-grants',
        'talks',
        'education',
        'teaching-service'
      ];
      const headings = sectionIds
        .map(function(id) { return document.getElementById(id); })
        .filter(Boolean);
      if (!headings.length) return;

      const tabList = document.createElement('div');
      tabList.className = 'tab-list';
      tabList.setAttribute('role', 'tablist');
      tabList.setAttribute('aria-label', 'Website sections');
      headings[0].parentNode.insertBefore(tabList, headings[0]);

      const tabs = [];
      const panels = [];

      headings.forEach(function(heading) {
        const id = heading.id;
        const label = heading.textContent.trim();
        const panel = document.createElement('section');
        panel.id = id + '-panel';
        panel.className = 'tab-panel';
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', id + '-tab');

        heading.parentNode.insertBefore(panel, heading);
        panel.appendChild(heading);
        let sibling = panel.nextElementSibling;
        while (sibling && sibling.tagName !== 'H1') {
          const next = sibling.nextElementSibling;
          panel.appendChild(sibling);
          sibling = next;
        }

        const tab = document.createElement('button');
        tab.id = id + '-tab';
        tab.className = 'tab-button';
        tab.type = 'button';
        tab.textContent = label.replace('Academic ', '');
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-controls', panel.id);
        tabList.appendChild(tab);
        tabs.push(tab);
        panels.push(panel);
      });

      function activateTab(index, updateHash) {
        tabs.forEach(function(tab, tabIndex) {
          const active = tabIndex === index;
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex = active ? 0 : -1;
          panels[tabIndex].hidden = !active;
        });
        if (updateHash) history.replaceState(null, '', '#' + headings[index].id);
      }

      tabs.forEach(function(tab, index) {
        tab.addEventListener('click', function() { activateTab(index, true); });
        tab.addEventListener('keydown', function(event) {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          let next = index;
          if (event.key === 'ArrowLeft') next = (index - 1 + tabs.length) % tabs.length;
          if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
          if (event.key === 'Home') next = 0;
          if (event.key === 'End') next = tabs.length - 1;
          activateTab(next, true);
          tabs[next].focus();
        });
      });

      const hashIndex = headings.findIndex(function(heading) {
        return '#' + heading.id === window.location.hash;
      });
      const researchIndex = headings.findIndex(function(heading) {
        return heading.id === 'research';
      });
      activateTab(hashIndex >= 0 ? hashIndex : researchIndex, false);
    });
  </script>
</body>
</html>
