<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$pagetitle$</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @layer utilities {
      .content h1 {
        @apply text-3xl font-bold text-gray-900 mt-12 mb-6 pb-2 border-b border-gray-200;
      }
      .content h1:first-child {
        @apply mt-0 text-4xl border-none pb-0 mb-2;
      }
      .content h2 {
        @apply text-2xl font-semibold text-gray-800 mt-10 mb-4;
      }
      .content h3 {
        @apply text-lg font-semibold text-gray-800 mt-6 mb-2;
      }
      .content p {
        @apply text-gray-700 leading-relaxed mb-4;
      }
      .content ul {
        @apply list-disc pl-6 mb-4 space-y-1;
      }
      .content li {
        @apply text-gray-700;
      }
      .content li p {
        @apply mb-1;
      }
      .content a {
        @apply text-blue-600 hover:text-blue-800 hover:underline transition-colors;
      }
      .content img {
        @apply rounded-full shadow-lg border-4 border-white ring-1 ring-gray-200;
      }
      .tab-list {
        @apply flex gap-1 mt-10 mb-8 overflow-x-auto border-b border-gray-200;
      }
      .tab-button {
        @apply whitespace-nowrap px-4 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-800 hover:border-gray-300 transition-colors;
      }
      .tab-button[aria-selected="true"] {
        @apply text-blue-700 border-blue-600;
      }
      .tab-button:focus-visible {
        @apply outline-none ring-2 ring-blue-500 ring-offset-2 rounded-t;
      }
      .tab-panel[hidden] {
        display: none;
      }
      .copy-markdown-button {
        @apply inline-flex items-center rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2;
      }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div class="max-w-3xl mx-auto px-6 py-12 sm:py-16">
    <main class="bg-white rounded-2xl shadow-sm border border-gray-100 px-8 py-10 sm:px-12 sm:py-12">
      <div class="mb-6 flex items-center justify-end gap-3">
        <span id="copy-markdown-status" class="text-sm text-gray-500" aria-live="polite"></span>
        <button id="copy-markdown" class="copy-markdown-button" type="button">Copy page as Markdown</button>
      </div>
      <article class="content">
$body$
      </article>
    </main>
    <footer class="mt-8 text-center text-sm text-gray-500">
      <p>&copy; $pagetitle$</p>
      <p>Last updated: <time id="last-updated" datetime="$lastupdated$">$lastupdated$</time></p>
    </footer>
  </div>
  <script src="page-markdown.js"></script>
  <script>
    // Turn the main CV sections into an accessible tab interface.
    document.addEventListener('DOMContentLoaded', function() {
      const copyButton = document.getElementById('copy-markdown');
      const copyStatus = document.getElementById('copy-markdown-status');

      function legacyCopy(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand('copy');
        textArea.remove();
        return copied;
      }

      copyButton.addEventListener('click', async function() {
        const markdown = window.PAGE_MARKDOWN;
        if (!markdown) {
          copyStatus.textContent = 'Markdown unavailable';
          return;
        }
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(markdown);
          } else if (!legacyCopy(markdown)) {
            throw new Error('Copy command failed');
          }
          copyStatus.textContent = 'Copied';
          copyButton.textContent = 'Copied!';
          window.setTimeout(function() {
            copyStatus.textContent = '';
            copyButton.textContent = 'Copy page as Markdown';
          }, 2000);
        } catch (error) {
          copyStatus.textContent = 'Copy failed';
        }
      });

      const sectionIds = [
        'academic-employment',
        'research',
        'awards',
        'grants',
        'talks',
        'education'
      ];
      const headings = sectionIds
        .map(function(id) { return document.getElementById(id); })
        .filter(Boolean);
      if (!headings.length) return;

      const tabList = document.createElement('div');
      tabList.className = 'tab-list';
      tabList.setAttribute('role', 'tablist');
      tabList.setAttribute('aria-label', 'Website sections');
      headings[0].parentNode.insertBefore(tabList, headings[0]);

      const tabs = [];
      const panels = [];

      headings.forEach(function(heading) {
        const id = heading.id;
        const label = heading.textContent.trim();
        const panel = document.createElement('section');
        panel.id = id + '-panel';
        panel.className = 'tab-panel';
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', id + '-tab');

        heading.parentNode.insertBefore(panel, heading);
        panel.appendChild(heading);
        let sibling = panel.nextElementSibling;
        while (sibling && sibling.tagName !== 'H1') {
          const next = sibling.nextElementSibling;
          panel.appendChild(sibling);
          sibling = next;
        }

        const tab = document.createElement('button');
        tab.id = id + '-tab';
        tab.className = 'tab-button';
        tab.type = 'button';
        tab.textContent = label.replace('Academic ', '');
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-controls', panel.id);
        tabList.appendChild(tab);
        tabs.push(tab);
        panels.push(panel);
      });

      function activateTab(index, updateHash) {
        tabs.forEach(function(tab, tabIndex) {
          const active = tabIndex === index;
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex = active ? 0 : -1;
          panels[tabIndex].hidden = !active;
        });
        if (updateHash) history.replaceState(null, '', '#' + headings[index].id);
      }

      tabs.forEach(function(tab, index) {
        tab.addEventListener('click', function() { activateTab(index, true); });
        tab.addEventListener('keydown', function(event) {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          let next = index;
          if (event.key === 'ArrowLeft') next = (index - 1 + tabs.length) % tabs.length;
          if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
          if (event.key === 'Home') next = 0;
          if (event.key === 'End') next = tabs.length - 1;
          activateTab(next, true);
          tabs[next].focus();
        });
      });

      const hashIndex = headings.findIndex(function(heading) {
        return '#' + heading.id === window.location.hash;
      });
      const researchIndex = headings.findIndex(function(heading) {
        return heading.id === 'research';
      });
      activateTab(hashIndex >= 0 ? hashIndex : researchIndex, false);
    });
  </script>
</body>
</html>
